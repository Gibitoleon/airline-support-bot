name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      rag: ${{ steps.filter.outputs.rag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/application-backend/**'
            rag:
              - 'backend/rag-service/**'

  frontend:
    name: Build and deploy frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            gableo/airline-support:frontend
            gableo/airline-support:frontend-${{ github.sha }}

      - name: Deploy frontend to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          curl --fail --silent --show-error \
            --request POST "$RENDER_DEPLOY_HOOK"

  backend:
    name: Build and deploy backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend/application-backend
          push: true
          tags: |
            gableo/airline-support:backend
            gableo/airline-support:backend-${{ github.sha }}

      - name: Deploy backend to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          curl --fail --silent --show-error \
            --request POST "$RENDER_DEPLOY_HOOK"

  rag:
    name: Build and deploy RAG service
    needs: changes
    if: needs.changes.outputs.rag == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ChromaDB vector store
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p backend/rag-service/data/processed/vector_store

          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/storage/v1/object/authenticated/rag-vector-store/vector_store.zip" \
            -o vector_store.zip

          mkdir -p "$RUNNER_TEMP/vector_store_extract"

          unzip -q vector_store.zip \
            -d "$RUNNER_TEMP/vector_store_extract"

          CHROMA_DB=$(find "$RUNNER_TEMP/vector_store_extract" \
            -type f -name chroma.sqlite3 -print -quit)

          if [ -z "$CHROMA_DB" ]; then
            echo "ERROR: chroma.sqlite3 was not found in the downloaded archive."
            exit 1
          fi

          STORE_DIR=$(dirname "$CHROMA_DB")

          cp -a "$STORE_DIR/." \
            backend/rag-service/data/processed/vector_store/

          rm -rf vector_store.zip "$RUNNER_TEMP/vector_store_extract"

          echo "ChromaDB vector store downloaded successfully."

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push RAG image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/rag-service
          push: true
          tags: |
            gableo/airline-support:rag
            gableo/airline-support:rag-${{ github.sha }}

      - name: Deploy RAG service to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_RAG_DEPLOY_HOOK }}
        run: |
          curl --fail --silent --show-error \
            --request POST "$RENDER_DEPLOY_HOOK"
