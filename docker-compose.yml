services:
  frontend:
    build:
      context: ./frontend
    container_name: airline-frontend
    ports:
      - "5173:5173"
    depends_on:
      - application-backend
    restart: unless-stopped

  application-backend:
    build:
      context: ./backend/application-backend
    container_name: airline-backend
    command: npm run dev
    env_file:
      - ./backend/application-backend/.env.development
    environment:
      RAG_SERVICE_URL: http://rag-service:5001
    ports:
      - "3000:3000"
    depends_on:
      - rag-service
    restart: unless-stopped

  rag-service:
    build:
      context: ./backend/rag-service
    container_name: airline-rag-service
    env_file:
      - ./backend/rag-service/.env
    ports:
      - "5001:5001"
    volumes:
      - ./backend/rag-service/data/processed/vector_store:/app/data/processed/vector_store
    restart: unless-stopped
